name: Deploy to GitHub Pages (manual/legacy)

# Disabled from auto-deploying on push: the public/ site (admin panel, privacy,
# terms, opt-out) now lives on the Hostinger VPS at offerlens.asadigital.co.in.
# Kept as a manually-triggerable fallback rather than deleted outright.
on:
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # NOTE: actions/checkout is pinned to an immutable commit SHA. The three
      # actions/*-pages actions below are still on mutable tags - they are
      # first-party GitHub actions on a manual-only workflow that holds no
      # signing or Play Store credentials, so the risk is materially lower than
      # deploy.yml. To pin them, run this workflow once and copy each resolved
      # SHA from the log's "Download action repository '<action>' (SHA:...)" line.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload public/ to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
