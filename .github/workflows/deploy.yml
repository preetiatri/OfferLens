name: Deploy Offerlens to Play Store

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'public/**'
      - 'functions/**'
      - '.github/workflows/firebase-hosting.yml'

# Least privilege: this job only needs to read the repo. It publishes to the Play
# Store via a Google service account, not via the GitHub token, so no write scopes
# are required. Without this block the workflow inherits the repository default,
# which may grant write access to code, releases, packages and more.
permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to immutable commit SHAs rather than mutable
      # tags. A tag like @v4 can be repointed at new code by its maintainer (or an
      # attacker who compromises that account), and this workflow holds the app
      # signing key and Play Store publishing credentials. The trailing comment
      # records which version each SHA corresponds to.
      # To update: bump the SHA, then confirm it in the run log's
      # "Download action repository '<action>' (SHA:...)" line.
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore and Google Services
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          ENCODED_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          # NOTE: the variables MUST be quoted. Unquoted "echo $VAR" word-splits on
          # newlines, which silently corrupts a line-wrapped base64 secret.
          echo "$ENCODED_KEYSTORE" | base64 --decode > app/keystore.jks
          echo "$ENCODED_GOOGLE_SERVICES" | base64 --decode > app/google-services.json
          echo "storeFile=keystore.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      # Fails fast with a clear message instead of a cryptic DER parse error at the
      # signing step 3 minutes into the build. Prints no key material or passwords -
      # only the file's size and format magic bytes.
      - name: Verify decoded signing inputs
        run: |
          echo "keystore.jks size: $(stat -c%s app/keystore.jks) bytes (expected ~2558)"
          echo "keystore.jks magic: $(head -c 4 app/keystore.jks | xxd -p)  (expected 308209fa for PKCS12)"
          if head -c 4 app/keystore.jks | xxd -p | grep -qi '^3082'; then
            echo "OK: keystore looks like a valid PKCS12/DER file."
          elif head -c 4 app/keystore.jks | xxd -p | grep -qi '^feedfeed'; then
            echo "OK: keystore looks like a valid JKS file."
          else
            echo "ERROR: app/keystore.jks is NOT a valid keystore - the KEYSTORE_BASE64 secret"
            echo "       is malformed or was encoded from the wrong file. Re-create it (see README)."
            exit 1
          fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "ERROR: the KEY_ALIAS secret is empty. It must match the alias inside the keystore."
            exit 1
          fi
          echo "google-services.json size: $(stat -c%s app/google-services.json) bytes"
          head -c 1 app/google-services.json | grep -q '{' \
            && echo "OK: google-services.json starts with '{'." \
            || { echo "ERROR: google-services.json is not valid JSON - check GOOGLE_SERVICES_JSON_BASE64."; exit 1; }

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      # Keep the signed bundle available for download from the run summary. Needed
      # for the one-off manual first upload to Play Console (the Publishing API
      # cannot create a new app's first release), and useful for debugging after.
      # TODO pin to a SHA: unlike the other actions here, this one has never run in
      # this repo, so there is no resolved "Download action repository (SHA:...)"
      # line to copy from. After the next run, take the SHA from that log line and
      # pin it the same way as the actions above.
      - name: Upload AAB as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Clean up signing secrets
        if: always()
        run: rm -f app/keystore.jks keystore.properties app/google-services.json

      # Publishes to the internal testing track, not production. CI should never
      # push straight to production: internal releases are visible only to your
      # testers, and you promote to production manually in Play Console when ready.
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON }}
          packageName: com.offerlens.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
