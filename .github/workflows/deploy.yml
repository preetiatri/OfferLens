name: Deploy Offerlens to Play Store

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'public/**'
      - 'functions/**'
      - '.github/workflows/firebase-hosting.yml'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore and Google Services
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          ENCODED_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo $ENCODED_KEYSTORE | base64 --decode > app/keystore.jks
          echo $ENCODED_GOOGLE_SERVICES | base64 --decode > app/google-services.json
          echo "storeFile=keystore.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Temporary diagnostic step - remove once the wrapper-loading failure is understood.
      - name: Debug Gradle wrapper
        run: |
          echo "--- file listing ---"
          ls -la gradle/wrapper/
          echo "--- file type ---"
          file gradle/wrapper/gradle-wrapper.jar || echo "file command not available"
          echo "--- sha256 ---"
          sha256sum gradle/wrapper/gradle-wrapper.jar
          echo "--- zip contents (looking for GradleWrapperMain.class) ---"
          unzip -l gradle/wrapper/gradle-wrapper.jar | grep -i GradleWrapperMain || echo "CLASS NOT FOUND IN JAR"
          echo "--- java version ---"
          java -version
          echo "--- JAVA_HOME ---"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "--- which java ---"
          which java
          echo "--- direct classpath invocation test ---"
          java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain --version || echo "DIRECT INVOCATION FAILED"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Clean up signing secrets
        if: always()
        run: rm -f app/keystore.jks keystore.properties app/google-services.json

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON }}
          packageName: com.offerlens.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: production
          status: draft
