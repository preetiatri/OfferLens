<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OfferLens - Merchant Opt-Out Request</title>
    <style>
        :root {
            --primary: #00F5FF;
            --bg: #0A0A14;
            --surface: #1A1A2E;
            --text: #FFFFFF;
            --error: #FF5252;
            --success: #00FF88;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--surface);
            padding: 40px;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 { font-size: 24px; margin-bottom: 12px; color: var(--primary); }
        p { color: rgba(255,255,255,0.7); font-size: 14px; line-height: 1.6; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; }

        input, textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            background: var(--primary);
            color: var(--bg);
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        #status { margin-top: 20px; text-align: center; font-size: 14px; display: none; }
        .success { color: var(--success); }
        .error { color: var(--error); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Merchant Opt-Out</h1>
        <p>If you are a merchant or bank and wish to have your offers removed from OfferLens, please fill out this form.</p>
        <form id="optOutForm">
            <div class="form-group">
                <label for="merchant">Merchant / Bank Name</label>
                <input type="text" id="merchant" required>
            </div>
            <div class="form-group">
                <label for="email">Official Contact Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="reason">Reason (Optional)</label>
                <textarea id="reason"></textarea>
            </div>
            <button type="submit" id="submitBtn">Submit Request</button>
        </form>
        <div id="status"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDsYzRXx7iFG-Ezd3Au5-VZbcA1PkhHZHU",
            authDomain: "offerlens.firebaseapp.com",
            projectId: "offerlens",
            storageBucket: "offerlens.firebasestorage.app",
            messagingSenderId: "702877897804",
            appId: "1:702877897804:web:3e62dbfe9237f6a67390e9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('optOutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            try {
                await db.collection('opt_out_merchants').add({
                    merchant: document.getElementById('merchant').value,
                    email: document.getElementById('email').value,
                    reason: document.getElementById('reason').value,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    status: 'pending'
                });
                status.textContent = '✅ Submitted successfully.';
                status.className = 'success';
                status.style.display = 'block';
                document.getElementById('optOutForm').reset();
            } catch (err) {
                status.textContent = '❌ Error submitting request.';
                status.className = 'error';
                status.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Submit Request';
            }
        });
    </script>
</body>
</html>
