android.useAndroidX=true
android.enableJetifier=false

# ===== GRADLE PERFORMANCE OPTIMIZATIONS =====

# Increase JVM heap from 2GB to 4GB (more memory = faster compilation)
org.gradle.jvmargs=-Xmx4096m -Xms512m -XX:+UseParallelGC -Dfile.encoding=UTF-8 --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

# Run tasks in parallel across modules
org.gradle.parallel=true

# Keep the build daemon alive between builds (avoids JVM startup overhead)
org.gradle.daemon=true

# Cache configuration phase (big speedup on repeated builds)
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Reuse outputs from previous builds when inputs haven't changed
org.gradle.caching=true

# Lazy task graph evaluation
org.gradle.configureondemand=true

# Kotlin compiler daemon (avoids cold starts for Kotlin compilation)
kotlin.daemon.jvm.options=-Xmx2048m -Xms256m

# Use non-transitive R classes (reduces R.class bloat, speeds up compilation)
android.nonTransitiveRClass=true

# Disable unused build features to skip unnecessary processing
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false
